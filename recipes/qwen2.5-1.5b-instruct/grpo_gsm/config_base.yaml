# Script config
train_dataset_path: "./data/gsm-infinite/zero_context/realistic"
difficulty_list:
  - hard
  - medium
eval_dataset_path: "./data/gsm-infinite-eval/zero_context/realistic"
eval_difficulty_list:
  - hard
  - medium
reward_func_names:
  - f1
data_curriculum: random
prompt_method: cot

# Model arguments
model_name_or_path: "models/Qwen3-0.6B"
bf16: true
torch_dtype: bfloat16

# Trainer arguments
num_train_epochs: 3
per_device_train_batch_size: 6
gradient_accumulation_steps: 2
use_vllm: false
max_prompt_length: 3072
num_generations: 2
max_completion_length: 512

# Evaluation config
bf16_full_eval: true
eval_strategy: steps
eval_steps: 1000
per_device_eval_batch_size: 8

# Logging config
log_level: info
logging_strategy: steps
logging_first_step: true
logging_steps: 100
save_strategy: steps
save_steps: 500
save_total_limit: 5
log_completions: true
