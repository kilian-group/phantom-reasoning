# Script config
dataset_name: "kilian-group/phantom-wiki-v1"
split_name: "depth_20_size_50_seed_1"
reward_func_names: ["f1"]
data_curriculum: "random"
prompt_method: "cot"

###################
# Model arguments #
###################
model_name_or_path: "Qwen/Qwen2.5-3B-Instruct"
bf16: true
torch_dtype: bfloat16
attn_implementation: flash_attention_2
# LoRA arguments
use_peft: true
lora_target_modules: all-linear
# Reference: https://huggingface.co/docs/peft/en/developer_guides/quantization#loraconfig
# Blog: https://huggingface.co/blog/4bit-transformers-bitsandbytes
load_in_4bit: true
bnb_4bit_quant_type: nf4
use_bnb_nested_quant: true

####################
# Trainer arguments #
####################
num_train_epochs: 10
# Logging config
log_level: "info"
logging_strategy: "steps"
logging_first_step: true
logging_steps: 10
save_strategy: "steps"
save_steps: 100
save_total_limit: 5
log_completions: true
