# Script config
dataset_name: "kilian-group/phantom-wiki-v1"
split_list: ["depth_20_size_50_seed_1", "depth_20_size_50_seed_2"]
from_local: false
eval_dataset_name: "kilian-group/phantom-wiki-v1"
eval_split_list: ["depth_20_size_50_seed_3"]
eval_from_local: false
reward_func_names: ["f1"]
data_curriculum: "random"
prompt_method: "cot"

# Model arguments
model_name_or_path: "Qwen/Qwen2.5-3B-Instruct"
bf16: true
torch_dtype: bfloat16

# LoRA arguments
use_peft: true
lora_target_modules: all-linear

# Trainer arguments
num_train_epochs: 3
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
use_vllm: true

# Evaluation config
bf16_full_eval: true
eval_on_start: false
eval_strategy: "steps"
eval_steps: 100
per_device_eval_batch_size: 64

# Logging config
log_level: "info"
logging_strategy: "steps"
logging_first_step: true
logging_steps: 10
save_strategy: "steps"
save_steps: 10
save_total_limit: 5
log_completions: true
