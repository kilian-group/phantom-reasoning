# Script config
dataset_name: "data/wiki-v1-easy-depth_20_size_25"
split_list:
  [
    "depth_20_size_25_seed_11",
    "depth_20_size_25_seed_12",
    "depth_20_size_25_seed_13",
    "depth_20_size_25_seed_14",
    "depth_20_size_25_seed_15",
    "depth_20_size_25_seed_16",
    "depth_20_size_25_seed_17",
    "depth_20_size_25_seed_18",
    "depth_20_size_25_seed_19",
    "depth_20_size_25_seed_20",
  ]
from_local: true
eval_dataset_name: "data/wiki-v1-easy-depth_20_size_25"
eval_split_list: ["depth_20_size_25_seed_1"]
eval_from_local: true
reward_func_names: ["f1"]
data_curriculum: "random"
prompt_method: "cot"

# Model arguments
model_name_or_path: "Qwen/Qwen3-1.7B"
ignore_think_tags_in_outputs: true # Qwen3 models produce <think> tags in outputs, which we ignore for reward
bf16: true
torch_dtype: bfloat16

# Trainer arguments
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
use_vllm: false
# size_25 universe is about 2500 tokens, so we set the max length to 4096
max_prompt_length: 4096
# Should be divisble by number of GPUs. Anvil has 4 GPUs on a node, and we use 3 for training to reserve
# one for evaluation.
num_generations: 6
# TODO: potentially increase this for longer outputs (needed for higher diff questions)
max_completion_length: 512

# Evaluation config
bf16_full_eval: true
# eval_on_start: true
eval_strategy: "steps"
eval_steps: 100
per_device_eval_batch_size: 8

# Logging config
log_level: "info"
logging_strategy: "steps"
logging_first_step: true
logging_steps: 50
save_strategy: "steps"
save_steps: 50
save_total_limit: 5
log_completions: true
num_completions_to_print: 0 # don't print completions to stdout
