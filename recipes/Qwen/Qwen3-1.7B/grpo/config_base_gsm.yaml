# Script config
dataset_name: "data/gsm-infinite-train/zero_context/realistic"
training_mode: "gsminfinite"
split_list: ["medium"]
eval_dataset_name: "data/gsm-infinite-eval/zero_context/realistic"
eval_split_list: ["medium"]
reward_func_names: ["f1"]
data_curriculum: "random"
prompt_method: "cot"

# Model arguments
model_name_or_path: "Qwen/Qwen3-1.7B"
bf16: true
torch_dtype: bfloat16
attn_implementation: "flash_attention_2" # Use flash attention for better performance
gradient_checkpointing: true # Enable gradient checkpointing for memory efficiency, automatically sets `use_cache=False`

# Trainer arguments
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
use_vllm: true
vllm_mode: "colocate"
vllm_gpu_memory_utilization: 0.20
generation_kwargs: {}

# 1024 is sufficient for gsm-infinite zero-context-realistic medium (no truncation)
max_prompt_length: 1024
# Should be divisble by number of GPUs.
num_generations: 4
max_completion_length: 4096

# Logging config
log_level: info
logging_strategy: steps
logging_first_step: true
logging_steps: 1000
save_strategy: steps
save_steps: 1000
log_completions: true
num_completions_to_print: 0
eval_strategy: "no"
