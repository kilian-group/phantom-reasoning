# Script config
training_mode: "hp"
dataset_name: "data/hp"
split_list: ["train"]
from_local: true
eval_dataset_name: "data/hp500"
eval_split_list: ["minidev"]
eval_from_local: true
reward_func_names: ["f1"]
data_curriculum: "random"
prompt_method: "cot"

# Model arguments
model_name_or_path: "Qwen/Qwen3-1.7B"
bf16: true
torch_dtype: bfloat16
attn_implementation: "flash_attention_2" # Use flash attention for better performance
gradient_checkpointing: true # Enable gradient checkpointing for memory efficiency, automatically sets `use_cache=False`

# Trainer arguments
num_train_epochs: 1
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
use_vllm: true
vllm_mode: "colocate"
vllm_gpu_memory_utilization: 0.20
generation_kwargs: {}

# size_25 universe is about 5000 tokens, so we set the max length to 6000
# TODO
max_prompt_length: 6000
# Should be divisble by number of GPUs.
num_generations: 4
max_completion_length: 4096

# Logging config
log_level: "info"
logging_strategy: "steps"
logging_first_step: true
logging_steps: 500
# save_steps is also when PW eval is run on the saved ckpt
save_strategy: "steps"
save_steps: 500
log_completions: true
num_completions_to_print: 0 # don't print completions to stdout
eval_strategy: "no" # NOTE: DO NOT EVALUATE because it slows down training by a lot
