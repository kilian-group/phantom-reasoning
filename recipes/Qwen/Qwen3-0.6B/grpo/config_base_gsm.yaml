# Script config
dataset_name: "./data/gsm-infinite-train/zero_context/realistic"
training_mode: "gsminfinite"
split_list:
  - medium
eval_dataset_name: "./data/gsm-infinite-eval/zero_context/realistic"
eval_split_list:
  - medium
reward_func_names:
  - f1
data_curriculum: random
prompt_method: cot

# Model arguments
model_name_or_path: "Qwen/Qwen3-0.6B"
bf16: true
torch_dtype: bfloat16

# Trainer arguments
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
use_vllm: true
vllm_mode: "colocate"
vllm_gpu_memory_utilization: 0.10
max_prompt_length: 3072
num_generations: 8
max_completion_length: 3072

# Evaluation config
bf16_full_eval: true
eval_strategy: steps
eval_steps: 1000
per_device_eval_batch_size: 8

# Logging config
log_level: info
logging_strategy: steps
logging_first_step: true
logging_steps: 100
save_strategy: steps
save_steps: 500
save_total_limit: 5
log_completions: true
num_completions_to_print: 0

# Generation kwargs passed to GRPO for sampling completions
generation_kwargs: {}
