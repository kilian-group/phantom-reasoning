# Script config
dataset_name: "data/wiki-v1"
split_list: [
    "depth_20_size_50_seed_10",
    "depth_20_size_50_seed_11",
    "depth_20_size_50_seed_12",
    "depth_20_size_50_seed_13",
    # "depth_20_size_50_seed_14",  # split not present
    "depth_20_size_50_seed_15",
    "depth_20_size_50_seed_16",
    "depth_20_size_50_seed_17",
    "depth_20_size_50_seed_18",
    "depth_20_size_50_seed_19",
    "depth_20_size_50_seed_20",
  ]
from_local: true
eval_dataset_name: "kilian-group/phantom-wiki-v1"
eval_split_list: ["depth_20_size_50_seed_1"]
eval_from_local: false
reward_func_names: ["f1"]
data_curriculum: "random"
prompt_method: "cot"

# Model arguments
model_name_or_path: "Qwen/Qwen2.5-3B-Instruct"
bf16: true
torch_dtype: bfloat16

# LoRA arguments
use_peft: true
lora_target_modules: all-linear

# QLoRA arguments
# Reference: https://huggingface.co/docs/peft/en/developer_guides/quantization#loraconfig
# Blog: https://huggingface.co/blog/4bit-transformers-bitsandbytes
load_in_4bit: true
bnb_4bit_quant_type: nf4
use_bnb_nested_quant: true

# Trainer arguments
num_train_epochs: 3
per_device_train_batch_size: 8
gradient_accumulation_steps: 1

# Logging config
log_level: "info"
logging_strategy: "steps"
logging_first_step: true
logging_steps: 500
save_strategy: "steps"
save_steps: 500
save_total_limit: 5
log_completions: true
eval_strategy: "no"
