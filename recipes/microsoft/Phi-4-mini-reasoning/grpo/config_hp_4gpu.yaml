# Script config
training_mode: "hp"
dataset_name: "data/hp"
split_list: ["train"]
from_local: true
eval_dataset_name: "data/hp500"
eval_split_list: ["minidev"]
eval_from_local: true
reward_func_names: ["f1"]
data_curriculum: "random"
prompt_method: "cot"

# Model arguments
model_name_or_path: "microsoft/Phi-4-mini-reasoning"
bf16: true
torch_dtype: bfloat16
attn_implementation: "flash_attention_2" # Use flash attention for better performance
gradient_checkpointing: true # Enable gradient checkpointing for memory efficiency, automatically sets `use_cache=False`

# Trainer arguments
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
use_vllm: true
vllm_mode: "colocate"
vllm_gpu_memory_utilization: 0.25
generation_kwargs: {}

max_prompt_length: 6000 # hotpotqa is about maximum ~3000 words, so 2*that should avoid truncation
num_generations: 8 # Should divide per_device_train_batch_size * number of GPUs.
max_completion_length: 4096

# Logging config
log_level: "info"
logging_strategy: "steps"
logging_first_step: true
logging_steps: 0.1 # logging is done every 0.1 of total training steps
save_strategy: "steps"
save_steps: 0.1 # save is done every 0.1 of total training steps
log_completions: true
num_completions_to_print: 0 # don't print completions to stdout
eval_strategy: "no" # NOTE: DO NOT EVALUATE because it slows down training by a lot
