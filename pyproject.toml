[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-reasoner"
description = "Phantom Reasoner"
version = "0.0.0"
authors = [
    {name="Albert Gong", email="agong@cs.cornell.edu"},
    {name="Anmol Kabra", email="anmol@cs.cornell.edu"},
    {name="Johann Lee", email="jcl354@cornell.edu"},
    {name="Kamilė Stankevičiūtė", email="ks2448@cornell.edu"},
    {name="Raphael Thesmar", email="rft38@cornell.edu"},
    {name="Chao Wan", email="cw862@cornell.edu"},
]


readme = "README.md"
requires-python = "==3.12.*"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch",
    "vllm",
    "deepspeed",
    "trl[vllm] @ git+https://github.com/huggingface/trl.git",
    "transformers",
    "accelerate",
    "datasets",
    "peft",
    "huggingface_hub[cli]",
    "lighteval[math]",
    "wandb",
    "ujson", # needed for HotPotQA evaluation
    "reasoning_gym==0.1.24",
    "phantom-wiki[eval]>=1.0.3",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "black",
]

[project.urls]
Homepage = "https://github.com/anmolkabra/phantom-reasoning"
Issues = "https://github.com/anmolkabra/phantom-reasoning/issues"
Documentation = "https://anmolkabra.github.io/phantom-reasoning"
Repository = "https://github.com/anmolkabra/phantom-reasoning.git"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
