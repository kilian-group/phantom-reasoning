[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-reasoner"
description = "Phantom Reasoner"
version = "0.0.0"
authors = [
    {name="Albert Gong", email="agong@cs.cornell.edu"},
    {name="Anmol Kabra", email="anmol@cs.cornell.edu"},
    {name="Johann Lee", email="jcl354@cornell.edu"},
    {name="Kamilė Stankevičiūtė", email="ks2448@cornell.edu"},
    {name="Raphael Thesmar", email="rft38@cornell.edu"},
    {name="Chao Wan", email="cw862@cornell.edu"},
]


readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch",
    "vllm",
    "deepspeed",
    "trl[vllm]",
    "transformers",
    "accelerate",
    "datasets",
    "peft",
    "huggingface_hub[cli]",
    "phantom-wiki[eval]",
    "lighteval[math]",
    "wandb",
    "ujson", # needed for HotPotQA evaluation
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "black",
]
tests = [
    "pytest",
    "pytest-cov",
    "rootutils",
]
docs = [
    "mkdocs==1.6.0",
    "mkdocs-material==9.5.31",
    "mkdocstrings[python,shell]==0.25.2",
    "mkdocs-gen-files==0.5.0",
    "mkdocs-literate-nav==0.6.1",
    "mkdocs-section-index==0.3.9",
    "mkdocs-git-authors-plugin==0.9.0",
    "mkdocs-git-revision-date-localized-plugin==1.2.6"
]

[project.urls]
Homepage = "https://github.com/anmolkabra/phantom-reasoning"
Issues = "https://github.com/anmolkabra/phantom-reasoning/issues"
Documentation = "https://anmolkabra.github.io/phantom-reasoning"
Repository = "https://github.com/anmolkabra/phantom-reasoning.git"
